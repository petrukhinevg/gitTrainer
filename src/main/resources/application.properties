spring.application.name=gitTrainer
server.port=8083
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/git_trainer}
spring.datasource.username=${POSTGRES_USER:git_trainer}
spring.datasource.password=${POSTGRES_PASSWORD:git_trainer}
spring.datasource.driver-class-name=org.postgresql.Driver
gittrainer.validator.cli.enabled=false
gittrainer.validator.cli.timeout-ms=5000
gittrainer.validator.cli.allow-external-executable=false
gittrainer.validator.cli.inherit-environment=false
gittrainer.validator.cli.working-directory=${user.dir}
gittrainer.validator.cli.allowed-working-directory-root=${user.dir}
gittrainer.validator.cli.max-output-bytes=16384
