stages:
  - test
  - build
  - deploy

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  APP_JAR_GLOB: "build/libs/*.jar"
  DEPLOY_PORT: "22"
  DEPLOY_PATH: "/opt/gittrainer/current/gitTrainer-0.0.1-SNAPSHOT.jar"
  SYSTEMD_SERVICE: "gittrainer"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - frontend/node_modules/

test:
  stage: test
  image: gradle:8.14.3-jdk21
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends nodejs npm
  script:
    - ./gradlew clean check
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/reports/
      - frontend/test-results/
  rules:
    - if: '$CI_COMMIT_BRANCH'

build_jar:
  stage: build
  image: gradle:8.14.3-jdk21
  needs:
    - job: test
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends nodejs npm
  script:
    - ./gradlew clean bootJar
    - ls -la build/libs
  artifacts:
    name: "gittrainer-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - build/libs/*.jar
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy_production:
  stage: deploy
  image: alpine:3.21
  needs:
    - job: build_jar
      artifacts: true
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - export APP_JAR="$(ls $APP_JAR_GLOB | head -n 1)"
    - test -n "$APP_JAR"
  script:
    - scp -P "$DEPLOY_PORT" "$APP_JAR" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
    - ssh -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo systemctl restart ${SYSTEMD_SERVICE} && sudo systemctl status ${SYSTEMD_SERVICE} --no-pager"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
